[package]
name = "qiuzhi"
version = "1.0.0"
description = "AI career assistant"
authors = ["qiuzhi"]
edition = "2021"

[lib]
name = "qiuzhi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
